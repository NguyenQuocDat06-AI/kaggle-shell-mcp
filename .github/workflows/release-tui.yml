name: Release Rust TUI Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach prebuilt binaries to (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bin_name: kgsh-tui.exe
            asset: kgsh-tui-windows-x86_64.zip
          - name: linux-x86_64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            bin_name: kgsh-tui
            asset: kgsh-tui-linux-x86_64.tar.gz
            use_cross_toolchain: true
          - name: linux-aarch64
            os: ubuntu-latest
            rust_target: aarch64-unknown-linux-musl
            bin_name: kgsh-tui
            asset: kgsh-tui-linux-aarch64.tar.gz
            use_cross_toolchain: true
          - name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            bin_name: kgsh-tui
            asset: kgsh-tui-macos-arm64.tar.gz
          - name: macos-x86_64
            os: macos-latest
            rust_target: x86_64-apple-darwin
            bin_name: kgsh-tui
            asset: kgsh-tui-macos-x86_64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Linux musl cross toolchain (${{ matrix.rust_target }})
        if: matrix.use_cross_toolchain == true
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.rust_target }}

      - name: Build release binary
        run: cargo build --release --manifest-path tui/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist_tui | Out-Null
          Compress-Archive -Path "tui/target/${{ matrix.rust_target }}/release/${{ matrix.bin_name }}" -DestinationPath "dist_tui/${{ matrix.asset }}" -Force

      - name: Package Unix tar.gz
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist_tui
          tar -C "tui/target/${{ matrix.rust_target }}/release" -czf "dist_tui/${{ matrix.asset }}" "${{ matrix.bin_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist_tui/${{ matrix.asset }}

  upload-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS and upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          cd artifacts
          sha256sum kgsh-tui-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${TAG}" kgsh-tui-* SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
