[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-shell-mcp"
version = "1.0.1"
description = "Turn free 12h Kaggle Dual-T4 GPUs into live remote terminals & detached job runners for AI Agents via MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Dat Nguyen", email = "nquocdat06.work@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "kaggle",
    "gpu",
    "ai-agent",
    "remote-terminal",
    "claude-code",
    "cursor",
    "pytorch",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "kaggle>=2.2.0",
    "six>=1.16.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/NguyenQuocDat06-AI/kaggle-shell-mcp"
Repository = "https://github.com/NguyenQuocDat06-AI/kaggle-shell-mcp"
Issues = "https://github.com/NguyenQuocDat06-AI/kaggle-shell-mcp/issues"

[project.scripts]
kgsh = "kaggle_mcp.server:main"
kaggle-shell-mcp = "kaggle_mcp.server:main"
kaggle-mcp = "kaggle_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
